<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>講義｜生成式 AI 課程講義</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page lesson-layout">
    <nav class="toc" id="toc" aria-label="本講章節"></nav>
    <article class="article">
      <p class="crumb"><a href="index.html">講義目錄</a> ／ <span id="crumb-now">載入中</span></p>
      <div id="content"><p class="loading">講義載入中…</p></div>
      <nav class="pager" id="pager" aria-label="上一講／下一講"></nav>
      <p class="source-link" id="source"></p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="assets/common.js"></script>
  <script>
    renderChrome("lesson");
    const params = new URLSearchParams(location.search);
    const content = document.getElementById("content");

    (async () => {
      const data = await loadLessons();
      const lessons = data.lessons;
      const id = params.get("id") || lessons[0].id;
      const idx = lessons.findIndex((l) => l.id === id);
      if (idx < 0) throw new Error(`找不到第 ${id} 講`);
      const lesson = lessons[idx];

      const md = await loadNote(id);
      content.innerHTML = renderMarkdown(md);

      // 大標題：「第 NN 講」放小字
      const h1 = content.querySelector("h1");
      if (h1) h1.innerHTML = `<small>第 ${esc(id)} 講</small>${esc(lesson.title)}${/[？?]$/.test(lesson.title) ? "" : "："}${esc(lesson.subtitle)}`;
      document.title = `第 ${id} 講 ${lesson.title}｜${SITE.name}`;
      document.getElementById("crumb-now").textContent = `第 ${id} 講`;

      enhanceArticle(content, id);

      // 上課錄影：放在大標題下方；講義裡的時間點可以點
      if (lesson.video && h1) {
        const player = videoBlock(lesson.video);
        h1.after(player);
        linkTimestamps(content, player.seek);
      }

      // 左側目錄（h2）
      const heads = [...content.querySelectorAll("h2")];
      const mobile = matchMedia("(max-width: 900px)").matches;
      document.getElementById("toc").innerHTML = `<details${mobile ? "" : " open"}>
        <summary>本講章節（${heads.length}）</summary>
        <h2>本講章節</h2>
        <ol>${heads.map((h) => `<li><a href="#${h.id}">${esc(h.textContent)}</a></li>`).join("")}</ol>
      </details>`;
      const links = [...document.querySelectorAll(".toc a")];
      const spy = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          links.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === `#${e.target.id}`));
        });
      }, { rootMargin: "-80px 0px -70% 0px" });
      heads.forEach((h) => spy.observe(h));

      // 上一講／下一講
      const prev = lessons[idx - 1], next = lessons[idx + 1];
      document.getElementById("pager").innerHTML =
        (prev ? `<a class="prev" href="lesson.html?id=${prev.id}"><small>← 上一講</small>第 ${prev.id} 講 ${esc(prev.title)}</a>` : "") +
        (next ? `<a class="next" href="lesson.html?id=${next.id}"><small>下一講 →</small>第 ${next.id} 講 ${esc(next.title)}</a>` : "");
      document.getElementById("source").innerHTML =
        `這一頁由 <code>notes/lecture-${esc(id)}.md</code> 自動產生 · <a href="${SITE.repo}/blob/main/notes/lecture-${esc(id)}.md">在 GitHub 看原始 Markdown</a>`;

      if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
    })().catch((e) => {
      content.innerHTML = `<p class="empty">${esc(e.message)}。<a href="index.html">回講義目錄</a></p>`;
    });
  </script>
</body>
</html>
